<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAGA XPRESS — Espace livreur</title><link rel="manifest" href="manifest-livreur.json"><meta name="theme-color" content="#01245e"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FAGA XPRESS">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><style>[hidden]{display:none!important}
:root{--navy:#01245e;--or2:#e85d00;--ink:#0d1b34;--mut:#5c6b82;--line:#d5deeb;--page:#f2f5fa}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;background:var(--page);color:var(--ink);font:15px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif}
header{background:#fff;border-bottom:4px solid #fc6401;padding:8px 16px}.in{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.in img{height:60px;width:auto}main{max-width:760px;margin:0 auto;padding:16px 14px 40px}
.card{background:#fff;border:1px solid #e3e9f3;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:0 10px 28px rgba(1,36,94,.08)}
h2{margin:0 0 10px;font-size:19px;color:var(--navy)}label{display:block;font-weight:700;margin:12px 0 4px;font-size:13px}
input{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font:inherit}
button,.b{display:inline-flex;align-items:center;justify-content:center;min-height:46px;border:0;border-radius:12px;padding:0 16px;font-weight:800;cursor:pointer;text-decoration:none;font-size:14px}
.p{background:var(--or2);color:#fff;width:100%;margin-top:14px}.s{background:#fff;border:1.5px solid var(--navy);color:var(--navy)}.g{background:#12834c;color:#fff}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{font-size:12px;font-weight:800;border-radius:99px;padding:3px 10px;background:#fff3e9;color:var(--or2)}.pill.d{background:#e3f6ec;color:#12834c}
.r{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #eef2f8}.r span:first-child{color:var(--mut)}.r span:last-child{text-align:right;font-weight:600;word-break:break-word}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.err{color:#b42318;margin-top:10px;font-weight:600}.empty{text-align:center;color:var(--mut);padding:30px 0}
@media(min-width:900px){body{font-size:16px}main{max-width:900px}}</style></head><body>
