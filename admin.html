<title>FAGA XPRESS — Administration des livraisons</title><link rel="manifest" href="manifest-admin.json"><meta name="theme-color" content="#01245e"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="FAGA XPRESS">
<style>
    :root {
      color-scheme: light;
      --navy: #01245e;
      --orange-bright: #fc6401;
      --orange: #e85d00;
      --ink: #0d1b34;
      --muted: #5c6b82;
      --line: #d5deeb;
      --surface: #ffffff;
      --page: #f2f5fa;
      --tint: #fff3e9;
      --green: #12834c;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    body {
      margin: 0; background: var(--page); color: var(--ink);
      font: 15px/1.5 "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    :focus-visible { outline: 3px solid var(--orange-bright); outline-offset: 2px; }

    .topbar {
      background: #fff; border-bottom: 4px solid var(--orange-bright);
      padding: max(10px, env(safe-area-inset-top)) 16px 10px;
    }
    .top-inner { max-width: 720px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .logo { height: 54px; width: auto; display: block; }
    .top-call {
      border: 1.5px solid var(--navy); color: var(--navy); text-decoration: none;
      font-weight: 800; font-size: 13px; padding: 9px 15px; border-radius: 999px; white-space: nowrap;
    }

    .hero {
      position: relative; overflow: hidden; background: var(--navy); color: #fff;
      padding: 32px 16px 62px;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 30px), 0 100%);
    }
    .hero::before {
      content: ""; position: absolute; top: 22px; right: 0; width: 55%; height: 130px; opacity: .55;
      background:
        linear-gradient(90deg, transparent, var(--orange-bright)) 0 8px / 100% 4px no-repeat,
        linear-gradient(90deg, transparent, #fff) 30% 30px / 70% 3px no-repeat,
        linear-gradient(90deg, transparent, var(--orange-bright)) 10% 56px / 90% 3px no-repeat,
        linear-gradient(90deg, transparent, #fff) 45% 82px / 55% 2px no-repeat,
        linear-gradient(90deg, transparent, var(--orange-bright)) 20% 108px / 80% 4px no-repeat;
    }
    .hero-inner { position: relative; max-width: 720px; margin: auto; }
    .hero h1 {
      margin: 0 0 10px; max-width: 12em; font-size: clamp(28px, 7.4vw, 40px);
      line-height: 1.08; font-weight: 850; font-style: italic; letter-spacing: -.01em;
    }
    .hero p { margin: 0; max-width: 470px; color: #cfdcf2; }

    main { position: relative; z-index: 1; max-width: 720px; margin: -38px auto 0; padding: 0 14px 26px; }
    .card {
      background: var(--surface); border: 1px solid #e3e9f3; border-radius: 18px;
      padding: 20px; margin-bottom: 14px; box-shadow: 0 10px 28px rgba(1, 36, 94, .08);
    }
    .section-title { display: flex; align-items: center; gap: 12px; margin: 0 0 4px; font-size: 18px; font-style: italic; font-weight: 850; color: var(--navy); }
    .section-number { position: relative; z-index: 0; display: grid; place-items: center; width: 30px; height: 30px; color: #fff; font-size: 14px; font-style: normal; font-weight: 800; }
    .section-number::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--navy); border-radius: 7px; transform: skewX(-14deg); box-shadow: 3px 3px 0 var(--orange-bright); }
    .section-help { color: var(--muted); font-size: 13px; margin: 0 0 14px 42px; }

    .field { margin-top: 14px; }
    label { display: block; margin: 0 0 6px; color: var(--ink); font-size: 13px; font-weight: 700; }
    .required { color: #d4380d; }
    input, select, textarea {
      width: 100%; min-height: 48px; padding: 11px 13px; color: var(--ink); background: #fff;
      border: 1.5px solid var(--line); border-radius: 10px; outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    textarea { min-height: 84px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(252, 100, 1, .28); }
    input::placeholder, textarea::placeholder { color: #94a1b5; }
    input[type="file"] { padding: 9px 11px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .location-row { display: flex; gap: 8px; }
    .location-row input { min-width: 0; }
    .small-btn { flex: 0 0 auto; border: 0; background: var(--navy); color: #fff; border-radius: 10px; padding: 0 14px; font-size: 13px; font-weight: 750; cursor: pointer; }
    .choice-note { background: var(--page); border-left: 3px solid var(--navy); border-radius: 10px; padding: 11px 13px; color: var(--muted); font-size: 12.5px; margin-top: 14px; }
    .photo-hint { color: var(--muted); font-size: 12.5px; margin: 7px 0 0; }
    .photo-preview { display: block; max-width: 140px; max-height: 140px; margin-top: 8px; border-radius: 10px; border: 1px solid var(--line); object-fit: cover; }

    .price-panel { background: var(--tint); border: 1px solid #ffd9bd; border-left: 5px solid var(--orange-bright); border-radius: 12px; padding: 14px 15px; margin-top: 18px; }
    .price-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .price-label { font-weight: 750; }
    .price-value { color: var(--navy); font-weight: 900; font-style: italic; font-size: 21px; text-align: right; }
    .price-caption { margin: 6px 0 0; color: #5a4a3c; font-size: 12.5px; }
    .checkline { display: flex; align-items: flex-start; gap: 10px; margin-top: 16px; color: var(--muted); font-size: 12.5px; font-weight: 400; }
    .checkline input { width: 18px; min-height: 18px; margin: 2px 0 0; accent-color: var(--navy); }
    .submit {
      width: 100%; min-height: 56px; margin-top: 18px; border: 0; border-radius: 12px;
      background: var(--orange); color: #fff; font-size: 18px; font-weight: 850; font-style: italic;
      cursor: pointer; box-shadow: 0 8px 18px rgba(232, 93, 0, .3);
    }
    .submit:active { transform: translateY(1px); }
    .toast { min-height: 20px; margin: 10px 2px 0; color: #b4351c; font-size: 13px; }
    .toast.success { color: var(--green); }

    .contact-card { background: var(--navy); border-color: var(--navy); text-align: center; padding: 20px; }
    .contact-card p { margin: 0 0 14px; color: #cfdcf2; font-size: 14px; }
    .call-btn { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; min-height: 50px; border-radius: 12px; background: #fff; color: var(--navy); text-decoration: none; font-weight: 800; border-bottom: 4px solid var(--orange-bright); }
    .footer { text-align: center; color: var(--muted); font-size: 12px; padding: 4px 12px calc(22px + env(safe-area-inset-bottom)); }
    .hidden { display: none !important; }

    .modal { position: fixed; inset: 0; z-index: 50; background: rgba(1, 20, 52, .65); display: flex; align-items: flex-end; justify-content: center; }
    .modal-box { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom)); }
    .modal-head { background: var(--navy); color: #fff; margin: -20px -18px 14px; padding: 18px; border-bottom: 4px solid var(--orange-bright); }
    .modal-head h3 { margin: 0 0 3px; font-size: 19px; font-style: italic; font-weight: 850; }
    .modal-head .sub { margin: 0; color: #cfdcf2; font-size: 13px; }
    .recap-group { background: var(--page); border: 1px solid #e0e7f2; border-radius: 12px; padding: 4px 13px; margin-bottom: 10px; }
    .recap-group h4 { margin: 10px 0 2px; font-size: 14px; font-style: italic; font-weight: 850; color: var(--navy); }
    .recap-row { display: flex; justify-content: space-between; gap: 14px; padding: 7px 0; border-bottom: 1px solid #e1e8f2; font-size: 14px; }
    .recap-row:last-child { border-bottom: 0; }
    .recap-row span:first-child { color: var(--muted); flex: 0 0 auto; }
    .recap-row span:last-child { text-align: right; font-weight: 650; word-break: break-word; }
    .recap-photo { display: block; max-width: 120px; max-height: 120px; border-radius: 10px; margin: 4px 0 8px auto; object-fit: cover; }
    .confirm-q { text-align: center; font-weight: 800; margin: 16px 0 10px; color: var(--navy); }
    .confirm-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-no, .btn-yes { min-height: 52px; border-radius: 12px; font-weight: 800; font-size: 15px; cursor: pointer; }
    .btn-no { border: 1.5px solid var(--navy); background: #fff; color: var(--navy); }
    .btn-yes { border: 0; background: var(--orange); color: #fff; }
    @media (min-width: 600px) {
      .modal { align-items: center; padding: 20px; }
      .modal-box { border-radius: 22px; }
      .modal-head { border-radius: 22px 22px 0 0; }
    }
    @media (max-width: 520px) {
      .card { padding: 17px; }
      .grid { grid-template-columns: 1fr; gap: 0; }
      .logo { height: 46px; }
    }
  
    .tabs { display: flex; gap: 8px; max-width: 720px; margin: 10px auto 0; padding: 0 14px; }
    .tab { flex: 1; min-height: 44px; border: 1.5px solid var(--navy); background: #fff; color: var(--navy); border-radius: 999px; font-weight: 800; cursor: pointer; }
    .tab.on { background: var(--navy); color: #fff; }
    #viewTrack, #viewAdmin, #viewLogin { margin-top: 14px; }
    .tl { list-style: none; margin: 14px 0 6px; padding: 0 0 0 6px; }
    .tl li { position: relative; padding: 0 0 16px 28px; color: var(--muted); }
    .tl li::before { content: ""; position: absolute; left: 0; top: 2px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); background: #fff; }
    .tl li::after { content: ""; position: absolute; left: 6px; top: 18px; bottom: -2px; width: 2px; background: var(--line); }
    .tl li:last-child::after { display: none; }
    .tl li.done { color: var(--ink); }
    .tl li.done::before { background: var(--green); border-color: var(--green); }
    .tl li b { display: block; }
    .tl li span { font-size: 12px; color: var(--muted); }
    .codebox { text-align: center; background: var(--tint); border: 2px dashed var(--orange-bright); border-radius: 14px; padding: 16px; margin: 12px 0; }
    .codebox b { display: block; font-size: 30px; letter-spacing: .08em; color: var(--navy); }
    .o-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .o-name { font-weight: 850; color: var(--navy); }
    .o-meta { color: var(--muted); font-size: 12.5px; }
    .pill { font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: var(--tint); color: var(--orange); white-space: nowrap; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    .stat { background: #fff; border: 1px solid #e3e9f3; border-radius: 12px; padding: 10px; text-align: center; }
    .stat b { display: block; font-size: 22px; color: var(--navy); }
    .stat span { font-size: 11.5px; color: var(--muted); }
    .toolbar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .toolbar .full, .o-ctrl .full { grid-column: 1 / -1; }
    .btn2 { min-height: 44px; border: 1.5px solid var(--navy); background: #fff; color: var(--navy); border-radius: 10px; font-weight: 750; cursor: pointer; padding: 0 12px; text-decoration: none; display: inline-flex; align-items: center; }
    .btn2.pri { background: var(--navy); color: #fff; }
    .btn2.del { border-color: #b4351c; color: #b4351c; }
    .order { background: #fff; border: 1px solid #e3e9f3; border-left: 5px solid var(--navy); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
    .order.s-Nouvelle { border-left-color: var(--orange-bright); }
    .order.s-Livrée { border-left-color: var(--green); }
    .order.s-Annulée { border-left-color: #94a1b5; opacity: .75; }
    .o-body { margin-top: 10px; display: none; }
    .order.open .o-body { display: block; }
    .o-body .recap-row { padding: 5px 0; font-size: 13.5px; }
    .o-ctrl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .o-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .empty { text-align: center; color: var(--muted); padding: 24px 10px; }
    @media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } }

const h = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (ts) => new Date(ts).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
const STATUTS = ["Nouvelle", "Confirmée", "En cours de livraison", "Livrée", "Annulée"];
const SC = { "Nouvelle": "#1f4fd8", "Confirmée": "#6d3fd6", "En cours de livraison": "#f59e0b", "Livrée": "#12a05c", "Annulée": "#e03a3a" };
let all = [], livs = [], timer = null, view = "dash";

const money = (n) => Math.round(n).toLocaleString("fr-FR") + " FCFA";
const price = (o) => {
  const f = parseInt(String(o.tarif_final || "").replace(/\D/g, ""), 10); if (f) return f;
  const m = String(o.tarif_affiche || "").match(/(\d[\d\s\u00a0\u202f]*)\s*FCFA/); return m ? parseInt(m[1].replace(/\D/g, ""), 10) || 0 : 0;
};
const wa = (t) => { const d = String(t || "").replace(/\D/g, ""); return d.length === 8 || d.length === 10 ? "229" + d : d; };
const lk = (s) => h(s).replace(/https?:\/\/[^\s]+/g, (u) => '<a href="' + u + '" target="_blank" rel="noopener">Voir sur la carte</a>');
const lv = (id) => livs.find((l) => l.id === id);
const place = (s) => { const m = String(s || "").match(/maps\?q=(-?[\d.]+,-?[\d.]+)/); return m ? m[1] : String(s || "").replace(/\s*[—:-]?\s*https?:\/\/\S+/, "").trim(); };
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0) + "%";

function go(v) {
  view = v;
  ["dash", "cmd", "liv"].forEach((x) => $("p" + x[0].toUpperCase() + x.slice(1)).classList.toggle("hidden", x !== v));
  document.querySelectorAll("#adminTabs .tab").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
}
$("adminTabs").onclick = (e) => { const b = e.target.closest("[data-v]"); if (b) go(b.dataset.v); };

function showApp(on) {
  $("viewLogin").classList.toggle("hidden", on); $("viewAdmin").classList.toggle("hidden", !on); $("logout").classList.toggle("hidden", !on);
  clearInterval(timer); if (on) { load(); timer = setInterval(load, 30000); }
}
$("loginBtn").onclick = async () => {
  const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("pwd").value });
  if (error) { $("loginMsg").textContent = "Email ou mot de passe incorrect."; return; }
  showApp(true);
};
$("logout").onclick = async () => { await sb.auth.signOut(); all = []; livs = []; showApp(false); };
sb.auth.getSession().then(({ data }) => { if (data.session) showApp(true); });

async function load() {
  const [a, b] = await Promise.all([
    sb.from("orders").select("*").order("created_at", { ascending: false }),
    sb.from("livreurs").select("*").order("nom")
  ]);
  if (a.error) { $("dashBody").innerHTML = '<p class="empty">Lecture impossible : ' + h(a.error.message) + "</p>"; return; }
  all = a.data; livs = b.error ? [] : b.data;
  $("livMsg").textContent = b.error ? "Table « livreurs » introuvable : exécutez d'abord le script SQL fourni." : "";
  renderDash(); renderLiv(); fillLivFilter();
  if (!(view === "cmd" && $("orders").contains(document.activeElement))) renderOrders();
}

/* ---------- TABLEAU DE BORD ---------- */
function inPeriod() {
  const p = +$("period").value; if (!p) return all;
  const lim = Date.now() - p * 864e5; return all.filter((o) => new Date(o.created_at).getTime() >= lim);
}
const count = (arr, fn) => { const m = {}; arr.forEach((o) => { const k = fn(o); if (k) m[k] = (m[k] || 0) + 1; }); return Object.entries(m).sort((a, b) => b[1] - a[1]); };
function bars(en) {
  const mx = Math.max(1, ...en.map((e) => e[1]));
  return en.length ? en.map(([l, c]) => '<div class="bar"><i title="' + h(l) + '">' + h(l) + '</i><u><s style="width:' + (c / mx) * 100 + '%"></s></u><b>' + c + "</b></div>").join("") : '<p class="empty">Aucune donnée.</p>';
}
function chart(days) {
  const keys = [...Array(days)].map((_, i) => new Date(Date.now() - (days - 1 - i) * 864e5).toLocaleDateString("sv-SE"));
  const cnt = keys.map((k) => all.filter((o) => new Date(o.created_at).toLocaleDateString("sv-SE") === k).length);
  const mx = Math.max(4, ...cnt), X = (i) => 34 + i * (556 / (days - 1)), Y = (c) => 190 - (c / mx) * 160;
  const pts = cnt.map((c, i) => X(i) + "," + Y(c)).join(" "), step = Math.ceil(days / 7);
  return '<svg viewBox="0 0 600 220" width="100%" role="img" aria-label="Évolution des commandes">' +
    [0, 0.5, 1].map((f) => '<line x1="34" x2="590" y1="' + Y(mx * f) + '" y2="' + Y(mx * f) + '" stroke="#e3e9f3"/><text x="28" y="' + (Y(mx * f) + 4) + '" font-size="11" text-anchor="end" fill="#5c6b82">' + Math.round(mx * f) + "</text>").join("") +
    '<polygon points="34,190 ' + pts + ' 590,190" fill="#1f4fd8" opacity=".12"/><polyline points="' + pts + '" fill="none" stroke="#1f4fd8" stroke-width="3" stroke-linejoin="round"/>' +
    cnt.map((c, i) => (days <= 14 ? '<circle cx="' + X(i) + '" cy="' + Y(c) + '" r="4" fill="#1f4fd8"/>' : "")).join("") +
    keys.map((k, i) => (i % step === 0 || i === days - 1 ? '<text x="' + X(i) + '" y="210" font-size="11" text-anchor="middle" fill="#5c6b82">' + k.slice(8) + "/" + k.slice(5, 7) + "</text>" : "")).join("") + "</svg>";
}
function renderDash() {
  const L = inPeriod(), n = (s) => L.filter((o) => o.statut === s).length;
  const tot = L.length, done = n("Livrée"), canc = n("Annulée"), nouv = n("Nouvelle"), enc = n("Confirmée") + n("En cours de livraison");
  const unas = L.filter((o) => !o.livreur_id && ["Nouvelle", "Confirmée"].includes(o.statut)).length;
  const ca = L.filter((o) => o.statut === "Livrée").reduce((s, o) => s + price(o), 0);
  const k = (c, l, v, s) => '<div class="kpi ' + c + '"><span>' + l + "</span><b>" + v + "</b><small>" + (s || "&nbsp;") + "</small></div>";
  const C = 2 * Math.PI * 60; let acc = 0;
  const ring = STATUTS.map((s) => { const c = n(s); if (!c) return ""; const d = (C * c) / tot; const el = '<circle cx="80" cy="80" r="60" fill="none" stroke="' + SC[s] + '" stroke-width="22" stroke-dasharray="' + d + " " + (C - d) + '" stroke-dashoffset="' + -acc + '" transform="rotate(-90 80 80)"/>'; acc += d; return el; }).join("");
  const legend = STATUTS.map((s) => '<div class="lg"><span style="background:' + SC[s] + '"></span>' + s + "<b>" + n(s) + " (" + pct(n(s), tot) + ")</b></div>").join("");
  const perf = livs.map((l) => { const mine = all.filter((o) => o.livreur_id === l.id); return "<tr><td>" + h(l.nom) + "</td><td>" + mine.filter((o) => ["Confirmée", "En cours de livraison"].includes(o.statut)).length + "</td><td>" + mine.filter((o) => o.statut === "Livrée").length + "</td></tr>"; }).join("");
  const last = L.slice(0, 6).map((o) => "<tr data-code=\"" + h(o.code) + "\"><td>" + h(o.code) + "</td><td>" + h(o.nom) + "</td><td>" + h(String(o.service || "").split(" : ")[0]) + '</td><td><span class="st" style="background:' + SC[o.statut] + "22;color:" + SC[o.statut] + '">' + h(o.statut) + "</span></td><td>" + h((lv(o.livreur_id) || {}).nom || "—") + "</td><td>" + fmt(o.created_at) + "</td></tr>").join("");
  $("dashBody").innerHTML =
    (unas ? '<div class="choice-note" style="margin:0 0 12px">⚠️ <b>' + unas + "</b> commande(s) en attente d'assignation à un livreur.</div>" : "") +
    '<div class="kpis">' + k("k1", "Total commandes", tot) + k("k5", "Nouvelles", nouv, "à traiter") + k("k3", "En cours", enc) + k("k2", "Livrées", done, pct(done, tot) + " du total") + k("k4", "Annulées", canc, pct(canc, tot) + " du total") + k("k7", "Sans livreur", unas) + k("k6", "CA estimé", money(ca), "commandes livrées") + k("k8", "Panier moyen", done ? money(ca / done) : "—", "par livraison") + "</div>" +
    '<div class="cols"><div class="card"><h3>Évolution des commandes</h3>' + chart(+$("period").value || 30) + '</div><div class="card"><h3>Répartition</h3><div class="donut"><svg viewBox="0 0 160 160" width="170" height="170">' + ring + '<text x="80" y="82" text-anchor="middle" font-size="26" font-weight="800" fill="#01245e">' + tot + '</text><text x="80" y="100" text-anchor="middle" font-size="11" fill="#5c6b82">Total</text></svg></div>' + legend + "</div></div>" +
    '<div class="cols2"><div class="card"><h3>Par type de service</h3>' + bars(count(L, (o) => String(o.service || "").split(" : ")[0])) + '</div><div class="card"><h3>Standard / Express</h3>' + bars(count(L, (o) => o.option)) + '</div><div class="card"><h3>Contenu des colis</h3>' + bars(count(L, (o) => String(o.contenu || "").split(" : ")[0])) + '</div><div class="card"><h3>Heures de pointe</h3>' + bars(count(L, (o) => new Date(o.created_at).getHours() + "h").slice(0, 6)) + '</div><div class="card"><h3>Meilleurs clients</h3>' + bars(count(L, (o) => (o.nom || "") + " · " + (o.tel || "")).slice(0, 5)) + '</div><div class="card"><h3>Performance des livreurs</h3>' + (perf ? '<div class="tw"><table><tr><th>Livreur</th><th>En cours</th><th>Livrées</th></tr>' + perf + "</table></div>" : '<p class="empty">Ajoutez des livreurs dans l\'onglet Livreurs.</p>') + "</div></div>" +
    '<div class="card"><h3>Dernières commandes</h3><div class="tw"><table><tr><th>Code</th><th>Client</th><th>Service</th><th>Statut</th><th>Livreur</th><th>Date</th></tr>' + (last || '<tr><td colspan="6">Aucune commande.</td></tr>') + "</table></div></div>";
}
$("period").onchange = renderDash;
$("dashBody").onclick = (e) => { const r = e.target.closest("[data-code]"); if (r) { $("q").value = r.dataset.code; go("cmd"); renderOrders(); } };

/* ---------- COMMANDES ---------- */
function fillLivFilter() {
  const cur = $("fLiv").value;
  $("fLiv").innerHTML = '<option value="">Tous les livreurs</option><option value="none">Non assignées</option>' + livs.map((l) => '<option value="' + h(l.id) + '">' + h(l.nom) + "</option>").join("");
  $("fLiv").value = cur;
}
const livOpts = (sel) => '<option value="">— Non assigné —</option>' + livs.filter((l) => l.actif || l.id === sel).map((l) => '<option value="' + h(l.id) + '"' + (l.id === sel ? " selected" : "") + ">" + h(l.nom) + "</option>").join("");
function dirUrl(o) { return "https://www.google.com/maps/dir/?api=1&origin=" + encodeURIComponent(place(o.retrait)) + "&destination=" + encodeURIComponent(place(o.livraison)); }
function msgLivreur(o) {
  const L = (k, v) => (v && v !== "Non précisé" ? k + " : " + v + "\n" : "");
  return "🚚 *Nouvelle livraison FAGA XPRESS*\n" + L("Code", o.code) + L("Client", o.nom + " " + o.tel) + L("Retrait", o.retrait) + L("Livraison", o.livraison) + L("Destinataire", [o.destinataire, o.tel_destinataire].filter(Boolean).join(" ")) + L("Colis", [o.contenu, o.taille].filter(Boolean).join(", ")) + L("Option", o.option) + L("Date", o.date_livraison) + L("Heure de récupération", o.heure_recuperation) + L("Instructions", o.instructions) + L("Tarif", o.tarif_final ? o.tarif_final + " FCFA" : o.tarif_affiche) + "\nItinéraire : " + dirUrl(o);
}
function renderOrders() {
  const q = $("q").value.trim().toLowerCase(), fs = $("fStatus").value, fl = $("fLiv").value;
  const open = new Set([...document.querySelectorAll(".order.open")].map((n) => n.dataset.id));
  const list = all.filter((o) => (!fs || o.statut === fs) && (!fl || (fl === "none" ? !o.livreur_id : o.livreur_id === fl)) && (!q || JSON.stringify(o).toLowerCase().includes(q)));
  if (!list.length) { $("orders").innerHTML = '<p class="empty">Aucune commande.</p>'; return; }
  $("orders").innerHTML = list.map((o) => {
    const rows = [["Code", o.code], ["Téléphone", o.tel], ["Service", o.service], ["Retrait", o.retrait], ["Livraison", o.livraison], ["Destinataire", o.destinataire], ["Tél. destinataire", o.tel_destinataire], ["Contenu", o.contenu], ["Taille", o.taille], ["Date souhaitée", o.date_livraison], ["Heure de récupération", o.heure_recuperation], ["Option", o.option], ["Instructions", o.instructions], ["Tarif affiché", o.tarif_affiche], ["Livreur", (lv(o.livreur_id) || {}).nom]]
      .filter(([, v]) => v && v !== "Non précisé").map(([k, v]) => '<div class="recap-row"><span>' + k + "</span><span>" + lk(v) + "</span></div>").join("");
    return '<div class="order s-' + h(o.statut) + (open.has(String(o.id)) ? " open" : "") + '" data-id="' + h(o.id) + '"><div class="o-head" data-toggle style="cursor:pointer"><div><div class="o-name">' + h(o.nom) + '</div><div class="o-meta">' + h(o.code) + " · " + h(o.service) + " · " + fmt(o.created_at) + '</div></div><span class="pill">' + h(o.statut) + '</span></div><div class="o-body">' + rows +
      '<div class="o-ctrl"><select data-f="statut">' + STATUTS.map((s) => "<option" + (s === o.statut ? " selected" : "") + ">" + s + "</option>").join("") + '</select><input data-f="tarif_final" inputmode="numeric" placeholder="Tarif final (FCFA)" value="' + h(o.tarif_final) + '"><select data-f="livreur_id" class="full">' + livOpts(o.livreur_id) + '</select><textarea class="full" data-f="note" placeholder="Note interne (livreur, paiement…)">' + h(o.note) + "</textarea></div>" +
      '<div class="o-actions"><button type="button" class="btn2 pri" data-assign>Assigner + WhatsApp livreur</button><button type="button" class="btn2" data-save>Enregistrer</button><a class="btn2" href="tel:' + h(o.tel) + '">Appeler</a><a class="btn2" target="_blank" rel="noopener" href="https://wa.me/' + wa(o.tel) + '">WhatsApp client</a><a class="btn2" target="_blank" rel="noopener" href="' + h(dirUrl(o)) + '">Itinéraire</a><button type="button" class="btn2 del" data-del>Supprimer</button></div></div></div>';
  }).join("");
}
const collect = (card) => { const p = {}; card.querySelectorAll("[data-f]").forEach((el) => { p[el.dataset.f] = el.value.trim(); }); if (p.livreur_id === "") p.livreur_id = null; return p; };
$("orders").addEventListener("click", async (ev) => {
  const card = ev.target.closest(".order"); if (!card) return;
  const id = card.dataset.id, o = all.find((x) => String(x.id) === id);
  if (ev.target.closest("[data-toggle]")) { card.classList.toggle("open"); return; }
  let r = null;
  if (ev.target.closest("[data-save]") || ev.target.closest("[data-assign]")) {
    const patch = collect(card), assign = !!ev.target.closest("[data-assign]");
    if (assign) {
      const l = lv(patch.livreur_id);
      if (!l) { alert("Choisissez d'abord un livreur."); return; }
      window.open("https://wa.me/" + wa(l.tel) + "?text=" + encodeURIComponent(msgLivreur(o)), "_blank");
      if (patch.statut === "Nouvelle") patch.statut = "Confirmée";
    }
    if ((patch.livreur_id || null) !== (o.livreur_id || null)) patch.assigned_at = patch.livreur_id ? new Date().toISOString() : null;
    r = await sb.from("orders").update(patch).eq("id", id);
  } else if (ev.target.closest("[data-del]") && confirm("Supprimer définitivement cette commande ?")) {
    r = await sb.from("orders").delete().eq("id", id);
  } else return;
  if (r.error) alert("Action impossible : " + r.error.message); else load();
});
["q", "fStatus", "fLiv"].forEach((i) => $(i).addEventListener("input", renderOrders));
$("refresh").onclick = load;
$("exportCsv").onclick = () => {
  const cols = ["created_at", "code", "nom", "tel", "service", "retrait", "livraison", "destinataire", "tel_destinataire", "contenu", "taille", "date_livraison", "heure_recuperation", "option", "instructions", "tarif_affiche", "tarif_final", "statut", "livreur", "note"];
  const cell = (v) => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const csv = "\ufeff" + [cols.join(";")].concat(all.map((o) => cols.map((c) => cell(c === "livreur" ? (lv(o.livreur_id) || {}).nom : o[c])).join(";"))).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = "livraisons-faga-xpress.csv"; a.click();
};

/* ---------- LIVREURS ---------- */
function renderLiv() {
  $("lvList").innerHTML = livs.length ? livs.map((l) => {
    const mine = all.filter((o) => o.livreur_id === l.id), enc = mine.filter((o) => ["Confirmée", "En cours de livraison"].includes(o.statut)).length, done = mine.filter((o) => o.statut === "Livrée").length;
    return '<div class="card" data-lid="' + h(l.id) + '"><div class="o-head"><div><div class="o-name">' + h(l.nom) + '</div><div class="o-meta">' + h(l.tel) + " · " + enc + " en cours · " + done + ' livrées</div><div class="o-meta">Code d\'accès : <span class="code-a">' + h(l.code_acces || "—") + '</span></div></div><span class="pill">' + (l.actif ? "Actif" : "Inactif") + '</span></div><div class="o-actions" style="margin-top:10px"><a class="btn2 pri" target="_blank" rel="noopener" href="https://wa.me/' + wa(l.tel) + '?text=' + encodeURIComponent('Bonjour ' + l.nom + ', voici votre espace livreur FAGA XPRESS : ' + location.origin + '/livreur.html\nTéléphone : ' + l.tel + '\nCode d\'accès : ' + (l.code_acces || '')) + '">Envoyer l\'accès</a><a class="btn2" target="_blank" rel="noopener" href="https://wa.me/' + wa(l.tel) + '">WhatsApp</a><button type="button" class="btn2" data-tg>' + (l.actif ? "Désactiver" : "Activer") + '</button><button type="button" class="btn2 del" data-rm>Supprimer</button></div></div>';
  }).join("") : '<p class="empty">Aucun livreur pour le moment.</p>';
}
$("lvAdd").onclick = async () => {
  const nom = $("lvNom").value.trim(), tel = $("lvTel").value.trim();
  if (!nom || tel.replace(/\D/g, "").length < 8) { $("livMsg").textContent = "Renseignez le nom et un numéro valide."; return; }
  const { error } = await sb.from("livreurs").insert({ nom, tel });
  if (error) { $("livMsg").textContent = "Ajout impossible : " + error.message; return; }
  $("lvNom").value = ""; $("lvTel").value = ""; $("livMsg").textContent = ""; load();
};
$("lvList").onclick = async (e) => {
  const c = e.target.closest("[data-lid]"); if (!c) return; const id = c.dataset.lid; let r;
  if (e.target.closest("[data-tg]")) r = await sb.from("livreurs").update({ actif: !lv(id).actif }).eq("id", id);
  else if (e.target.closest("[data-rm]") && confirm("Supprimer ce livreur ? Ses commandes restent, sans livreur assigné.")) r = await sb.from("livreurs").delete().eq("id", id);
  else return;
  if (r.error) alert(r.error.message); else load();
};
</script><div id="fxi" style="display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:9999;background:#01245e;color:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 12px 32px rgba(0,0,0,.3);font:14px/1.4 system-ui,sans-serif;max-width:520px;margin:auto"><b style="font-size:15px">📲 Installer FAGA XPRESS</b><div id="fxit" style="margin:4px 0 10px;opacity:.92"></div><div style="display:flex;gap:8px"><button id="fxiy" style="flex:1;min-height:42px;border:0;border-radius:10px;background:#e85d00;color:#fff;font-weight:800;font-size:14px">Installer</button><button id="fxin" style="min-height:42px;border:1.5px solid #fff;border-radius:10px;background:transparent;color:#fff;font-weight:700;font-size:14px;padding:0 14px">Plus tard</button></div></div>
<script>(function(){if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
if(matchMedia("(display-mode: standalone)").matches||navigator.standalone)return;var K="fxi_off";try{if(localStorage.getItem(K)==="1")return}catch(e){}
var ios=/iphone|ipad|ipod/i.test(navigator.userAgent),b=document.getElementById("fxi"),t=document.getElementById("fxit"),y=document.getElementById("fxiy"),ev=null,show=function(){b.style.display="block"};
if(ios){t.innerHTML="Sur iPhone : appuyez sur <b>Partager</b> (le carré avec une flèche), puis <b>« Sur l’écran d’accueil »</b>.";y.style.display="none";setTimeout(show,3000)}
else addEventListener("beforeinstallprompt",function(e){e.preventDefault();ev=e;t.textContent="Accédez à votre espace en un clic, comme une application.";setTimeout(show,2000)});
y.onclick=async function(){if(!ev)return;ev.prompt();await ev.userChoice;ev=null;b.style.display="none"};
document.getElementById("fxin").onclick=function(){b.style.display="none";try{localStorage.setItem(K,"1")}catch(e){}};
addEventListener("appinstalled",function(){b.style.display="none"})})();</script>
</body></html>
